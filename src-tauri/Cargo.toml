[package]
name = "log-viewer"
version = "0.1.0"
description = "LogViewer desktop app"
authors = ["chyi"]
edition = "2021"
default-run = "log-viewer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "log_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "log-viewer-mcp"
path = "src/bin/log-viewer-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
encoding_rs = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
